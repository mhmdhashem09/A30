<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="mainTitle">My Student Page</h1>
    <p id="messege">I am learning JavaScript.</p>
    <p id="pageStatus">Waiting for the page to load...</p>
    <button id="helloButton">Say Hello</button>
    <button id="nameButton">Enter My Name</button>
    <button id="messegeButton">Change My Message</button>
    <div id="hoverBox">
        <p>Move your mouse here</p>
    </div>
    <ul>
        <li>Solving Math</li>
        <li>watching movies</li>
        <li>CodeBrave</li>
    </ul>
    <script>
        document.getElementById("helloButton").onclick= function(){
            alert("Welcome to my page!")
        };
        document.getElementById("nameButton").onclick= function(){
            var name=prompt("What is your name?")
            document.getElementById("mainTitle").textContent= "Welcome, "+name+"!";
        };
        document.getElementById("messegeButton").onclick= function(){
            document.getElementById("messege").textContent="I can make my Webpage interactive!";
        };
        document.getElementById("hoverBox").onmouseover= function(){
            document.getElementById("hoverBox").style.backgroundColor="orange";
            document.getElementById("hoverBox").textContent="You found me!";
        };
        document.getElementById("hoverBox").onmouseout= function(){
            document.getElementById("hoverBox").style.backgroundColor="lightgray";
            document.getElementById("hoverBox").textContent="Move your mouse here";
        };
        window.onload=function(){
            document.getElementById("pageStatus").textContent="Page is ready!"
        };
        document.getElementById("mainTitle").ondblclick=function(){
            document.getElementById("mainTitle").textContent= "My Student Page";
        };
    </script>
</body>
</html>
